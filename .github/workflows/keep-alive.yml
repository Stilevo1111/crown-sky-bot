name: Keep Render awake

on:
  schedule:
    # Каждые 8 минут — Render Free засыпает примерно через 15 минут
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot API
        run: curl -fsS https://bot-2bdu.onrender.com/health
      - name: Ping static site
        run: curl -fsS https://crown-sky.onrender.com/ || true
